<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nasigari Jitesh - README preview</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 24px;
        background: #ffffff;
        color: #242424;
        font-family: '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto',
          'Helvetica Neue', sans-serif;
      }

      p {
        margin: 0;
        font-size: 14px;
        opacity: 0.6;
        text-align: center;
        padding: 0 16px;
      }

      img {
        width: 100%;
        max-width: 560px;
      }

      code {
        font-family: 'SFMono-Regular', 'Consolas', 'Liberation Mono', monospace;
      }

      @media (prefers-color-scheme: dark) {
        body {
          background: #0d1117;
          color: #dcdcdc;
        }
      }
    </style>
  </head>
  <body>
    <!-- Local preview of the generated profile README animation. -->
    <!-- Run `node build-svg.js` to regenerate chat.svg, then reload this page. -->
    <img src="chat.svg" alt="Nasigari Jitesh Intro" />
    <p>
      Local preview of <code>chat.svg</code> - regenerate with
      <code>node build-svg.js</code>.<br />
      Source of truth for the layout and copy is <code>template.svg</code> and
      <code>build-svg.js</code>.
    </p>
  </body>
</html>
